  <title>LUPL Planner · 역산 준비 코치</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23111827'/%3E%3Ctext x='12' y='17' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='white'%3EL%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

  <style>
    :root { color-scheme: light; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, textarea, select, button { font-family: inherit; }
    input, textarea, select { font-size: 16px; }
    @media (min-width: 640px) { input, textarea, select { font-size: 14px; } }
    input[type="time"], input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; }
    .font-mono-tabular { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    @keyframes softpulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .pulse-dot { animation: softpulse 1.2s ease-in-out infinite; }
    .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 0.75rem); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-50 text-stone-950">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useEffect, useMemo, useRef, useState } = React;

    const STORAGE = {
      actions: 'lupl_reverse_action_presets_v1',
      places: 'lupl_reverse_place_presets_v1',
      plans: 'lupl_reverse_plans_v1',
      settings: 'lupl_reverse_settings_v1',
    };

    const DEFAULT_ACTIONS = [
      { id: 1, name: '씻기', duration: 30, aliases: '샤워, 머리감기, 씻고 나오기', category: '준비', optional: false },
      { id: 2, name: '옷 입기', duration: 10, aliases: '옷 고르기, 착장 정하기, 옷 갈아입기', category: '준비', optional: false },
      { id: 3, name: '가방 챙기기', duration: 5, aliases: '짐 챙기기, 준비물 챙기기, 물건 챙기기', category: '준비', optional: false },
      { id: 4, name: '화장하기', duration: 20, aliases: '메이크업, 얼굴 준비', category: '준비', optional: true },
      { id: 5, name: '머리 말리기', duration: 10, aliases: '드라이, 머리 정리', category: '준비', optional: true },
      { id: 6, name: '노트북 챙기기', duration: 3, aliases: '컴퓨터 챙기기, 충전기 챙기기', category: '준비물', optional: false },
      { id: 7, name: '자료 확인', duration: 8, aliases: '회의자료 확인, 발표자료 확인, 파일 확인', category: '업무', optional: false },
      { id: 8, name: '택시 부르기', duration: 5, aliases: '카카오택시, 택시 잡기', category: '이동 전', optional: false },
      { id: 9, name: '문단속', duration: 3, aliases: '불 끄기, 문 잠그기, 창문 확인', category: '마무리', optional: false },
      { id: 10, name: '신발 신기', duration: 3, aliases: '현관 준비, 나갈 준비', category: '마무리', optional: false },
    ];

    const DEFAULT_PLACES = [
      { id: 101, name: '러플 사무실', moveMin: 15, bufferMin: 10, transport: '차량' },
      { id: 102, name: '대구시청', moveMin: 40, bufferMin: 15, transport: '차량' },
      { id: 103, name: '광명학교', moveMin: 25, bufferMin: 15, transport: '차량' },
      { id: 104, name: '이룸고', moveMin: 35, bufferMin: 20, transport: '차량' },
      { id: 105, name: '동대구역', moveMin: 30, bufferMin: 20, transport: '차량' },
    ];

    const SITUATIONS = [
      { key: 'custom', label: '직접 입력', tasks: [] },
      { key: 'meeting', label: '외부 회의', tasks: ['씻기', '옷 입기', '자료 확인', '노트북 챙기기', '가방 챙기기', '문단속', '신발 신기'] },
      { key: 'class', label: '특수학교 수업', tasks: ['씻기', '옷 입기', '자료 확인', '노트북 챙기기', '가방 챙기기', '문단속', '신발 신기'] },
      { key: 'presentation', label: '발표', tasks: ['씻기', '옷 입기', '발표자료 확인', '노트북 챙기기', '가방 챙기기', '문단속', '신발 신기'] },
      { key: 'quick', label: '그냥 외출', tasks: ['씻기', '옷 입기', '가방 챙기기', '문단속', '신발 신기'] },
    ];

    const INTENSITIES = {
      relaxed: { label: '여유 준비', short: '여유', factor: 1.15, bufferAdd: 10, removeOptional: false, desc: '평소보다 넉넉하게 잡아요.' },
      normal: { label: '보통 준비', short: '보통', factor: 1, bufferAdd: 0, removeOptional: false, desc: '저장된 내 시간 기준이에요.' },
      fast: { label: '빠른 준비', short: '빠름', factor: .7, bufferAdd: 0, removeOptional: false, desc: '시간을 줄여서 딱 맞춰요.' },
      emergency: { label: '비상 준비', short: '비상', factor: .5, bufferAdd: -5, removeOptional: true, desc: '생략 가능한 일을 빼고 출발 중심으로 잡아요.' },
    };

    const load = (key, fallback) => {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch { return fallback; }
    };
    const save = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };

    const pad = (n) => String(n).padStart(2, '0');
    const formatTime = (date) => `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    const formatDateLabel = (date) => `${date.getMonth() + 1}월 ${date.getDate()}일`;
    const addMin = (date, min) => new Date(date.getTime() + min * 60000);
    const diffMin = (a, b) => Math.round((a.getTime() - b.getTime()) / 60000);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const normalize = (s) => String(s || '').toLowerCase().replace(/\s+/g, '').replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, '');
    const uid = () => Date.now() + Math.floor(Math.random() * 1000000);
    const todayISO = () => {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };
    const nowRoundedTime = () => {
      const d = new Date();
      d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5, 0, 0);
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const minutesLabel = (min) => {
      const v = Math.abs(Math.round(min));
      if (v < 60) return `${v}분`;
      return `${Math.floor(v / 60)}시간 ${v % 60}분`;
    };
    const countdownLabel = (sec) => {
      const s = Math.max(0, Math.floor(sec));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
    };

    function matchActionPreset(text, actions) {
      const n = normalize(text);
      if (!n) return null;
      return actions.find(p => {
        const names = [p.name, ...(String(p.aliases || '').split(',').map(v => v.trim()).filter(Boolean))];
        return names.some(name => {
          const nn = normalize(name);
          return nn && (n === nn || n.includes(nn) || nn.includes(n));
        });
      }) || null;
    }

    function matchPlacePreset(text, places) {
      const n = normalize(text);
      if (!n) return null;
      return places.find(p => {
        const pn = normalize(p.name);
        return pn && (n === pn || n.includes(pn) || pn.includes(n));
      }) || null;
    }

    function parseTaskLines(raw, actions, intensityKey) {
      const intensity = INTENSITIES[intensityKey] || INTENSITIES.normal;
      const lines = String(raw || '')
        .split(/[\n,，]/)
        .map(s => s.trim())
        .filter(Boolean);
      const source = lines.length ? lines : ['씻기', '옷 입기', '가방 챙기기', '문단속', '신발 신기'];

      return source.map((line, index) => {
        const minuteMatch = line.match(/(\d+)\s*분/);
        const explicitDuration = minuteMatch ? Number(minuteMatch[1]) : null;
        const cleanName = line.replace(/\d+\s*분/g, '').replace(/[()]/g, '').trim() || line.trim();
        const preset = matchActionPreset(cleanName, actions);
        const baseName = preset ? preset.name : cleanName;
        const baseDuration = explicitDuration || preset?.duration || 10;
        const optional = Boolean(preset?.optional);
        if (intensity.removeOptional && optional) return null;
        const factor = explicitDuration ? 1 : intensity.factor;
        const duration = Math.max(1, Math.round(baseDuration * factor));
        return {
          id: uid() + index,
          name: baseName,
          raw: line,
          duration,
          baseDuration,
          optional,
          presetId: preset?.id || null,
          status: 'todo',
          start: null,
          end: null,
        };
      }).filter(Boolean);
    }

    function dedupeTasks(tasks) {
      const seen = new Set();
      return tasks.filter(t => {
        const k = normalize(t.name);
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }

    function recalcPlan(plan, tasksOverride) {
      const tasks = (tasksOverride || plan.tasks).map(t => ({ ...t }));
      const prepTotal = tasks.reduce((sum, t) => sum + Number(t.duration || 0), 0);
      const arrival = new Date(plan.arrivalAt);
      const departureDeadline = addMin(arrival, -(Number(plan.moveMin || 0) + Number(plan.bufferMin || 0)));
      const prepStart = addMin(departureDeadline, -prepTotal);
      let cursor = new Date(prepStart);
      const timedTasks = tasks.map(t => {
        const start = new Date(cursor);
        const end = addMin(start, Number(t.duration || 0));
        cursor = new Date(end);
        return { ...t, start: start.toISOString(), end: end.toISOString() };
      });
      return {
        ...plan,
        tasks: timedTasks,
        prepTotal,
        prepStart: prepStart.toISOString(),
        departureDeadline: departureDeadline.toISOString(),
        updatedAt: new Date().toISOString(),
      };
    }

    function createPlan({ arrivalDate, arrivalTime, place, transport, moveMin, bufferMin, prepText, intensityKey, actions }) {
      const arrival = new Date(`${arrivalDate}T${arrivalTime || '09:00'}:00`);
      const intensity = INTENSITIES[intensityKey] || INTENSITIES.normal;
      const rawBuffer = Number(bufferMin || 0) + intensity.bufferAdd;
      const safeBuffer = Math.max(0, rawBuffer);
      const tasks = dedupeTasks(parseTaskLines(prepText, actions, intensityKey));
      const base = {
        id: uid(),
        title: `${place || '외출'} · ${formatDateLabel(arrival)} ${formatTime(arrival)}`,
        place: place || '장소 미정',
        transport: transport || '직접 입력',
        moveMin: Math.max(0, Number(moveMin || 0)),
        bufferMin: safeBuffer,
        intensityKey,
        arrivalAt: arrival.toISOString(),
        tasks,
        createdAt: new Date().toISOString(),
      };
      return recalcPlan(base);
    }

    function getRisk(plan, now = new Date()) {
      const arrival = new Date(plan.arrivalAt);
      const prepStart = new Date(plan.prepStart);
      const departure = new Date(plan.departureDeadline);
      const missing = Number(plan.prepTotal || 0) + Number(plan.moveMin || 0) + Number(plan.bufferMin || 0) - diffMin(arrival, now);
      if (now > arrival) {
        return { level: 'past', label: '이미 지난 일정이에요', detail: '새 일정으로 다시 계산해보세요.', color: 'bg-stone-900 text-white', missing };
      }
      if (now <= prepStart) {
        return { level: 'safe', label: '아직 여유 있어요', detail: `${minutesLabel(diffMin(prepStart, now))} 뒤에 준비를 시작하면 돼요.`, color: 'bg-emerald-50 text-emerald-800 border-emerald-200', missing };
      }
      if (now <= departure) {
        return { level: 'tight', label: '지금 시작하면 딱 맞아요', detail: '새 일을 시작하지 말고 바로 첫 단계로 가는 게 좋아요.', color: 'bg-amber-50 text-amber-800 border-amber-200', missing };
      }
      return { level: 'danger', label: `${minutesLabel(missing)} 부족해요`, detail: '빠른 준비나 비상 준비로 줄일 수 있는 항목을 먼저 정해요.', color: 'bg-red-50 text-red-800 border-red-200', missing };
    }

    function Icon({ children, className = 'w-4 h-4' }) {
      return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>;
    }
    const IconClock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
    const IconCheck = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;
    const IconPlay = (p) => <Icon {...p}><polygon points="6 3 20 12 6 21 6 3"/></Icon>;
    const IconPause = (p) => <Icon {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></Icon>;
    const IconPlus = (p) => <Icon {...p}><path d="M12 5v14"/><path d="M5 12h14"/></Icon>;
    const IconTrash = (p) => <Icon {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>;
    const IconX = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
    const IconEdit = (p) => <Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></Icon>;

    function App() {
      const [actions, setActions] = useState(() => load(STORAGE.actions, DEFAULT_ACTIONS));
      const [places, setPlaces] = useState(() => load(STORAGE.places, DEFAULT_PLACES));
      const [plans, setPlans] = useState(() => load(STORAGE.plans, []));
      const [tab, setTab] = useState('prepare');
      const [currentPlan, setCurrentPlan] = useState(null);
      const [focusPlan, setFocusPlan] = useState(null);
      const [editTask, setEditTask] = useState(null);
      const [toast, setToast] = useState('');

      useEffect(() => save(STORAGE.actions, actions), [actions]);
      useEffect(() => save(STORAGE.places, places), [places]);
      useEffect(() => save(STORAGE.plans, plans.slice(0, 30)), [plans]);

      const savePlan = (plan) => {
        setPlans(prev => [plan, ...prev.filter(p => p.id !== plan.id)].slice(0, 30));
      };

      const openPlan = (plan) => {
        setCurrentPlan(plan);
        setTab('prepare');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const updateCurrentPlan = (plan) => {
        setCurrentPlan(plan);
        savePlan(plan);
      };

      const applyEmergencyMode = () => {
        if (!currentPlan) return;
        const prepText = currentPlan.tasks.map(t => t.name).join('\n');
        const plan = createPlan({
          arrivalDate: currentPlan.arrivalAt.slice(0, 10),
          arrivalTime: formatTime(new Date(currentPlan.arrivalAt)),
          place: currentPlan.place,
          transport: currentPlan.transport,
          moveMin: currentPlan.moveMin,
          bufferMin: Math.max(0, currentPlan.bufferMin),
          prepText,
          intensityKey: 'emergency',
          actions,
        });
        updateCurrentPlan(plan);
        setToast('비상 준비로 다시 계산했어요.');
      };

      const updateTaskDuration = (task, duration, remember) => {
        if (!currentPlan) return;
        const newTasks = currentPlan.tasks.map(t => t.id === task.id ? { ...t, duration: Math.max(1, Number(duration || 1)), status: 'todo' } : t);
        const plan = recalcPlan(currentPlan, newTasks);
        updateCurrentPlan(plan);
        setEditTask(null);

        if (remember) {
          const matched = task.presetId ? actions.find(a => a.id === task.presetId) : matchActionPreset(task.name, actions);
          if (matched) {
            setActions(prev => prev.map(a => a.id === matched.id ? { ...a, duration: Math.max(1, Number(duration || 1)) } : a));
          } else {
            setActions(prev => [{ id: uid(), name: task.name, duration: Math.max(1, Number(duration || 1)), aliases: '', category: '준비', optional: false }, ...prev]);
          }
          setToast(`앞으로 '${task.name}'은 ${duration}분으로 기억할게요.`);
        } else {
          setToast('이번 일정에만 적용했어요.');
        }
      };

      return (
        <div className="min-h-screen pb-24 sm:pb-8">
          <Header />
          <main className="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-8">
            {tab === 'prepare' && (
              <PreparePage
                actions={actions}
                places={places}
                currentPlan={currentPlan}
                onPlan={plan => { setCurrentPlan(plan); savePlan(plan); }}
                onStartFocus={async (plan) => {
                  try { await document.documentElement.requestFullscreen?.(); } catch {}
                  setFocusPlan(plan);
                }}
                onSavePlace={(place) => { setPlaces(prev => [{ ...place, id: uid() }, ...prev]); setToast(`'${place.name}' 장소를 저장했어요.`); }}
                onEditTask={setEditTask}
                onEmergency={applyEmergencyMode}
              />
            )}
            {tab === 'plans' && <PlansPage plans={plans} onOpen={openPlan} onDelete={(id) => setPlans(prev => prev.filter(p => p.id !== id))} />}
            {tab === 'presets' && <PresetsPage actions={actions} setActions={setActions} places={places} setPlaces={setPlaces} />}
          </main>

          <BottomNav tab={tab} setTab={setTab} />
          {focusPlan && <FocusMode initialPlan={focusPlan} onClose={() => setFocusPlan(null)} onUpdatePlan={updateCurrentPlan} />}
          {editTask && <TaskEditModal task={editTask} onClose={() => setEditTask(null)} onSave={updateTaskDuration} />}
          {toast && <Toast text={toast} onClose={() => setToast('')} />}
        </div>
      );
    }

    function Header() {
      return (
        <header className="sticky top-0 z-30 bg-stone-50/90 backdrop-blur border-b border-stone-200">
          <div className="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-xl bg-stone-950 text-white flex items-center justify-center font-bold">L</div>
              <div>
                <div className="text-sm font-bold tracking-tight">LUPL Planner</div>
                <div className="text-[11px] text-stone-500">역산 준비 코치</div>
              </div>
            </div>
            <div className="hidden sm:block text-xs text-stone-500">도착 시간만 입력하면 준비 시작 시간을 계산해요</div>
          </div>
        </header>
      );
    }

    function BottomNav({ tab, setTab }) {
      const items = [
        { key: 'prepare', label: '준비' },
        { key: 'plans', label: '일정' },

    function PreparePage({ actions, places, currentPlan, onPlan, onStartFocus, onSavePlace, onEditTask, onEmergency }) {
      const [arrivalDate, setArrivalDate] = useState(todayISO());
      const [arrivalTime, setArrivalTime] = useState(nowRoundedTime());
      const [place, setPlace] = useState('');
      const [transport, setTransport] = useState('차량');
      const [moveMin, setMoveMin] = useState(30);
      const [bufferMin, setBufferMin] = useState(15);
      const [situation, setSituation] = useState('quick');
      const [prepText, setPrepText] = useState('씻기\n옷 입기\n가방 챙기기\n문단속\n신발 신기');
      const [intensityKey, setIntensityKey] = useState('normal');
      const [showAll, setShowAll] = useState(false);

      useEffect(() => {
        const matched = matchPlacePreset(place, places);
        if (matched) {
          setMoveMin(matched.moveMin);
          setBufferMin(matched.bufferMin);
          setTransport(matched.transport || '차량');
        }
      }, [place]);

      const applySituation = (key) => {
        setSituation(key);
        const found = SITUATIONS.find(s => s.key === key);
        if (found && found.tasks.length) setPrepText(found.tasks.join('\n'));
      };

      const handleCreate = () => {
        const plan = createPlan({ arrivalDate, arrivalTime, place, transport, moveMin, bufferMin, prepText, intensityKey, actions });
        onPlan(plan);
        setShowAll(false);
      };

      const matchedPlace = matchPlacePreset(place, places);
      const canSavePlace = place.trim() && !matchedPlace;

      return (
        <div className="space-y-4 sm:space-y-6">
          <section className="bg-white border border-stone-200 rounded-3xl p-4 sm:p-6 shadow-sm">
            <div className="mb-5">
              <h1 className="text-2xl sm:text-3xl font-black tracking-tight break-keep">몇 시까지 도착해야 하나요?</h1>
              <p className="text-sm text-stone-500 mt-2">씻기·이동·여유시간까지 거꾸로 계산해서 준비 시작 시간을 잡아요.</p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <Field label="도착 날짜">
                <input type="date" value={arrivalDate} onChange={e => setArrivalDate(e.target.value)} className="input" />
              </Field>
              <Field label="도착 시간">
                <input type="time" value={arrivalTime} onChange={e => setArrivalTime(e.target.value)} className="input text-xl font-bold font-mono-tabular" />
              </Field>
              <Field label="어디로 가나요?">
                <input value={place} onChange={e => setPlace(e.target.value)} placeholder="예: 대구시청, 이룸고" className="input" />
                {matchedPlace && <div className="mt-1 text-xs text-emerald-700">저장된 장소: 이동 {matchedPlace.moveMin}분 · 여유 {matchedPlace.bufferMin}분</div>}
              </Field>
              <Field label="이동 / 여유 시간">
                <div className="grid grid-cols-2 gap-2">
                  <input type="number" min="0" value={moveMin} onChange={e => setMoveMin(e.target.value)} className="input" placeholder="이동 분" />
                  <input type="number" min="0" value={bufferMin} onChange={e => setBufferMin(e.target.value)} className="input" placeholder="여유 분" />
                </div>
              </Field>
            </div>

            <div className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <Field label="상황 프리셋">
                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                  {SITUATIONS.map(s => (
                    <button key={s.key} onClick={() => applySituation(s.key)} className={`shrink-0 px-3 py-2 rounded-2xl text-sm border ${situation === s.key ? 'bg-stone-950 text-white border-stone-950' : 'bg-white text-stone-600 border-stone-200'}`}>{s.label}</button>
                  ))}
                </div>
              </Field>
              <Field label="준비 강도">
                <div className="grid grid-cols-4 gap-1 bg-stone-100 rounded-2xl p-1">
                  {Object.entries(INTENSITIES).map(([key, info]) => (
                    <button key={key} onClick={() => setIntensityKey(key)} className={`py-2 rounded-xl text-xs font-semibold ${intensityKey === key ? 'bg-white shadow-sm text-stone-950' : 'text-stone-500'}`}>{info.short}</button>
                  ))}
                </div>
                <div className="text-xs text-stone-500 mt-1">{INTENSITIES[intensityKey].desc}</div>
              </Field>
            </div>

            <Field label="준비할 일" className="mt-4">
              <textarea value={prepText} onChange={e => setPrepText(e.target.value)} rows="5" className="input min-h-32 resize-none" placeholder="예: 씻기, 옷 입기, 가방 챙기기" />
              <div className="mt-2 text-xs text-stone-500">한 줄씩 쓰거나 쉼표로 구분하세요. “씻기 30분”처럼 시간을 직접 써도 됩니다.</div>
            </Field>

            <button onClick={handleCreate} className="mt-5 w-full bg-stone-950 text-white py-4 rounded-2xl font-bold text-base active:scale-[.99] transition flex items-center justify-center gap-2">
              <IconClock className="w-5 h-5" /> 거꾸로 계산하기
            </button>
          </section>

          {currentPlan && (
            <PlanResult
              plan={currentPlan}
              showAll={showAll}
              setShowAll={setShowAll}
              onStartFocus={onStartFocus}
              onSavePlace={canSavePlace ? () => onSavePlace({ name: place.trim(), moveMin: Number(moveMin || 0), bufferMin: Number(bufferMin || 0), transport }) : null}
              onEditTask={onEditTask}

    function Field({ label, children, className = '' }) {
      return <label className={`block ${className}`}><div className="text-xs font-bold text-stone-700 mb-1.5">{label}</div>{children}</label>;
    }

    function PlanResult({ plan, showAll, setShowAll, onStartFocus, onSavePlace, onEditTask, onEmergency }) {
      const risk = getRisk(plan);
      const arrival = new Date(plan.arrivalAt);
      const prepStart = new Date(plan.prepStart);
      const departure = new Date(plan.departureDeadline);
      const firstTask = plan.tasks.find(t => t.status !== 'done') || plan.tasks[0];

      return (
        <section className="bg-white border border-stone-200 rounded-3xl overflow-hidden shadow-sm">
          <div className="p-5 sm:p-6 bg-stone-950 text-white">
            <div className="text-xs text-stone-400 mb-2">출발 마감선</div>
            <div className="text-3xl sm:text-5xl font-black tracking-tight font-mono-tabular">{formatTime(departure)}</div>
            <div className="text-lg sm:text-2xl font-bold mt-1 break-keep">에는 나가야 해요</div>
            <div className="grid grid-cols-3 gap-2 mt-5 text-center">
              <MiniInfo label="준비 시작" value={formatTime(prepStart)} />
              <MiniInfo label="도착 목표" value={formatTime(arrival)} />
              <MiniInfo label="총 필요" value={`${plan.prepTotal + plan.moveMin + plan.bufferMin}분`} />
            </div>
          </div>

          <div className="p-4 sm:p-6 space-y-4">
            <div className={`border rounded-2xl p-3 ${risk.color}`}>
              <div className="font-bold">{risk.label}</div>
              <div className="text-sm opacity-80 mt-0.5">{risk.detail}</div>
              {(risk.level === 'danger' || risk.level === 'tight') && (
                <div className="mt-3 flex flex-wrap gap-2">
                  <button onClick={onEmergency} className="px-3 py-2 bg-white/80 rounded-xl text-xs font-bold border border-current/10">비상 준비로 바꾸기</button>
                  <LateMessageButton plan={plan} />
                </div>
              )}
            </div>

            <div className="rounded-2xl bg-stone-50 border border-stone-100 p-4">
              <div className="text-xs text-stone-500 mb-1">지금 시작할 첫 단계</div>
              <div className="flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-xl font-black truncate">{firstTask?.name || '준비 완료'}</div>
                  <div className="text-sm text-stone-500 mt-1">다음 단계는 타이머 화면에서 하나씩 보여드려요.</div>
                </div>
                <button onClick={() => onStartFocus(plan)} className="shrink-0 px-4 py-3 bg-emerald-600 text-white rounded-2xl font-bold flex items-center gap-2 active:scale-[.98]">
                  <IconPlay className="w-4 h-4" /> 시작
                </button>
              </div>
            </div>

            <div className="flex flex-wrap gap-2">
              {onSavePlace && <button onClick={onSavePlace} className="px-3 py-2 text-sm border border-stone-200 rounded-xl hover:bg-stone-50">이 장소 이동시간 저장</button>}
              <button onClick={() => setShowAll(!showAll)} className="px-3 py-2 text-sm border border-stone-200 rounded-xl hover:bg-stone-50">{showAll ? '전체 일정 접기' : '전체 일정 보기'}</button>
            </div>

            {showAll && <TimelineList plan={plan} onEditTask={onEditTask} />}
          </div>
        </section>
      );
    }

    function MiniInfo({ label, value }) {
      return <div className="bg-white/10 rounded-2xl px-2 py-3"><div className="text-[11px] text-stone-400">{label}</div><div className="font-bold font-mono-tabular mt-0.5">{value}</div></div>;
    }

    function TimelineList({ plan, onEditTask }) {
      const departure = new Date(plan.departureDeadline);
      const arrival = new Date(plan.arrivalAt);
      return (
        <div className="space-y-2 pt-2">
          {plan.tasks.map((task, index) => (
            <div key={task.id} className="flex items-center gap-3 p-3 rounded-2xl border border-stone-100 bg-white">
              <div className="w-14 text-xs font-mono-tabular text-stone-500">{formatTime(new Date(task.start))}</div>
              <div className="flex-1 min-w-0">
                <div className="font-bold truncate">{task.name}</div>
                <div className="text-xs text-stone-500">{formatTime(new Date(task.start))} - {formatTime(new Date(task.end))} · {task.duration}분</div>
              </div>
              <button onClick={() => onEditTask(task)} className="p-2 text-stone-400 hover:text-stone-950 hover:bg-stone-100 rounded-xl"><IconEdit className="w-4 h-4" /></button>
            </div>
          ))}
          <div className="flex items-center gap-3 p-3 rounded-2xl border border-stone-200 bg-stone-50">
            <div className="w-14 text-xs font-mono-tabular text-stone-500">{formatTime(departure)}</div>
            <div className="flex-1"><div className="font-black">출발</div><div className="text-xs text-stone-500">이동 {plan.moveMin}분 · 여유 {plan.bufferMin}분 포함</div></div>
          </div>
          <div className="flex items-center gap-3 p-3 rounded-2xl border border-stone-200 bg-stone-950 text-white">
            <div className="w-14 text-xs font-mono-tabular text-stone-300">{formatTime(arrival)}</div>
            <div className="flex-1"><div className="font-black">도착</div><div className="text-xs text-stone-300">{plan.place}</div></div>
          </div>
        </div>
      );
    }

    function LateMessageButton({ plan }) {
      const [copied, setCopied] = useState(false);
      const copy = async () => {
        const risk = getRisk(plan);
        const text = `안녕하세요. 이동 준비 시간이 예상보다 지연되어 ${Math.max(5, Math.ceil(Math.max(risk.missing, 5) / 5) * 5)}분 정도 늦을 것 같습니다. 도착하는 대로 바로 연락드리겠습니다.`;
        try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch { alert(text); }
      };
      return <button onClick={copy} className="px-3 py-2 bg-white/80 rounded-xl text-xs font-bold border border-current/10">{copied ? '복사 완료' : '늦는다고 연락 문구'}</button>;
    }

    function FocusMode({ initialPlan, onClose, onUpdatePlan }) {
      const [plan, setPlan] = useState(() => ({ ...initialPlan, tasks: initialPlan.tasks.map(t => ({ ...t, status: 'todo' })) }));
      const [index, setIndex] = useState(0);
      const [running, setRunning] = useState(true);
      const [targetSec, setTargetSec] = useState((initialPlan.tasks[0]?.duration || 1) * 60);
      const [leftSec, setLeftSec] = useState((initialPlan.tasks[0]?.duration || 1) * 60);
      const startRef = useRef(Date.now());
      const wakeLockRef = useRef(null);

      const task = plan.tasks[index];
      const nextTask = plan.tasks[index + 1];
      const departure = new Date(plan.departureDeadline);
      const arrival = new Date(plan.arrivalAt);

      useEffect(() => {
        const lock = async () => {
          try {
            if ('wakeLock' in navigator) wakeLockRef.current = await navigator.wakeLock.request('screen');
          } catch {}
        };
        lock();
        return () => {
          try { wakeLockRef.current?.release?.(); } catch {}
          try { if (document.fullscreenElement) document.exitFullscreen?.(); } catch {}
        };
      }, []);

      useEffect(() => {
        if (!task) return;
        const sec = Math.max(60, Number(task.duration || 1) * 60);
        setTargetSec(sec);
        setLeftSec(sec);
        setRunning(true);
        startRef.current = Date.now();
      }, [index, task?.id]);

      useEffect(() => {
        if (!running || !task) return;
        const tick = () => {
          const elapsed = Math.floor((Date.now() - startRef.current) / 1000);
          setLeftSec(Math.max(0, targetSec - elapsed));
        };
        tick();
        const id = setInterval(tick, 250);
        return () => clearInterval(id);
      }, [running, targetSec, task?.id]);

      const syncPlan = (nextPlan) => {
        setPlan(nextPlan);
        onUpdatePlan(nextPlan);
      };

      const complete = () => {
        if (!task) return;
        const tasks = plan.tasks.map((t, i) => i === index ? { ...t, status: 'done' } : t);
        const nextPlan = { ...plan, tasks };
        syncPlan(nextPlan);
        if (index + 1 < plan.tasks.length) setIndex(index + 1);
        else setIndex(plan.tasks.length);
      };

      const skip = () => {
        if (!task) return;
        const tasks = plan.tasks.map((t, i) => i === index ? { ...t, status: 'skipped' } : t);
        const nextPlan = { ...plan, tasks };
        syncPlan(nextPlan);
        if (index + 1 < plan.tasks.length) setIndex(index + 1);
        else setIndex(plan.tasks.length);
      };

      const addFive = () => {
        if (!task) return;
        const tasks = plan.tasks.map((t, i) => i === index ? { ...t, duration: Number(t.duration || 0) + 5 } : t);
        const nextPlan = recalcPlan(plan, tasks);
        syncPlan(nextPlan);
        setTargetSec(prev => prev + 300);
        setLeftSec(prev => prev + 300);
        startRef.current = Date.now() - (targetSec - leftSec) * 1000;
      };

      const toggle = () => {
        if (running) setRunning(false);
        else {
          startRef.current = Date.now() - (targetSec - leftSec) * 1000;
          setRunning(true);
        }
      };

      const doneAll = index >= plan.tasks.length;
      const risk = getRisk(plan);

      return (
        <div className="fixed inset-0 z-50 bg-stone-950 text-white flex flex-col">
          <div className="px-5 pt-5 pb-3 flex items-center justify-between">
            <div className="flex items-center gap-2 text-xs text-stone-400"><span className="w-2 h-2 rounded-full bg-emerald-400 pulse-dot" />집중 모드</div>
            <button onClick={onClose} className="p-2 rounded-xl bg-white/10 text-stone-300"><IconX className="w-5 h-5" /></button>
          </div>

          <div className="flex-1 flex flex-col justify-center px-6 py-4 text-center">
            {!doneAll ? (
              <>
                <div className="text-sm text-stone-400 mb-3">지금 할 일</div>
                <div className="text-4xl sm:text-6xl font-black tracking-tight break-keep mb-6">{task.name}</div>
                <div className={`text-7xl sm:text-8xl font-black font-mono-tabular tracking-tighter ${leftSec === 0 ? 'text-red-400' : 'text-white'}`}>{countdownLabel(leftSec)}</div>
                <div className="mt-5 grid grid-cols-2 gap-3 text-left max-w-md mx-auto w-full">
                  <FocusInfo label="출발 마감" value={formatTime(new Date(plan.departureDeadline))} />
                  <FocusInfo label="도착 목표" value={formatTime(arrival)} />
                </div>
                <div className="mt-4 text-sm text-stone-400">다음: {nextTask ? nextTask.name : '출발 준비'}</div>
                {leftSec === 0 && <div className="mt-4 text-red-300 font-bold">예정 시간이 지났어요. 완료하거나 5분을 추가해보세요.</div>}
              </>
            ) : (
              <>
                <div className="text-sm text-stone-400 mb-3">준비 완료</div>
                <div className="text-4xl sm:text-6xl font-black tracking-tight break-keep mb-6">지금 나가면 돼요</div>
                <div className="text-6xl sm:text-8xl font-black font-mono-tabular tracking-tighter">{formatTime(departure)}</div>
                <div className="mt-5 text-stone-400">도착 목표 {formatTime(arrival)} · {plan.place}</div>
              </>
            )}
          </div>

          <div className="p-5 safe-bottom bg-stone-900 border-t border-white/10">
            {!doneAll ? (
              <div className="grid grid-cols-2 gap-2 max-w-md mx-auto">
                <button onClick={complete} className="col-span-2 py-4 bg-emerald-500 text-white rounded-2xl font-black text-lg flex items-center justify-center gap-2 active:scale-[.98]"><IconCheck className="w-5 h-5" />완료</button>
                <button onClick={addFive} className="py-3 bg-white/10 rounded-2xl font-bold">5분 더 필요</button>
                <button onClick={skip} className="py-3 bg-white/10 rounded-2xl font-bold">건너뛰기</button>
                <button onClick={toggle} className="col-span-2 py-3 bg-white text-stone-950 rounded-2xl font-bold flex items-center justify-center gap-2">{running ? <IconPause className="w-4 h-4" /> : <IconPlay className="w-4 h-4" />}{running ? '잠시 멈춤' : '다시 시작'}</button>
              </div>
            ) : (
              <button onClick={onClose} className="w-full max-w-md mx-auto block py-4 bg-white text-stone-950 rounded-2xl font-black">종료하기</button>
            )}
            <div className="mt-3 text-center text-xs text-stone-500">전체화면과 화면 켜짐 유지로 딴짓을 줄여요. 브라우저 권한에 따라 일부 기기에서는 제한될 수 있어요.</div>
          </div>
        </div>
      );
    }

    function FocusInfo({ label, value }) {
      return <div className="bg-white/10 rounded-2xl px-4 py-3"><div className="text-xs text-stone-400">{label}</div><div className="font-black font-mono-tabular text-xl mt-1">{value}</div></div>;
    }

    function TaskEditModal({ task, onClose, onSave }) {
      const [duration, setDuration] = useState(task.duration || 10);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>
          <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <div><div className="text-xs text-stone-500">시간 수정</div><h2 className="text-xl font-black">{task.name}</h2></div>
              <button onClick={onClose} className="p-2 rounded-xl hover:bg-stone-100"><IconX className="w-5 h-5" /></button>
            </div>
            <Field label="몇 분 걸리나요?">
              <input type="number" min="1" value={duration} onChange={e => setDuration(e.target.value)} className="input text-2xl font-black font-mono-tabular" />
            </Field>
            <div className="grid grid-cols-2 gap-2 mt-5">
              <button onClick={() => onSave(task, Number(duration), false)} className="py-3 rounded-2xl border border-stone-200 font-bold">이번만 적용</button>
              <button onClick={() => onSave(task, Number(duration), true)} className="py-3 rounded-2xl bg-stone-950 text-white font-bold">앞으로도 기억</button>
            </div>
            <div className="text-xs text-stone-500 mt-3">예: 씻기를 30분으로 기억하면 다음부터 ‘씻기’, ‘샤워’를 입력했을 때 30분으로 불러와요.</div>
          </div>
        </div>
      );
    }

    function PlansPage({ plans, onOpen, onDelete }) {
      return (
        <section className="bg-white border border-stone-200 rounded-3xl p-4 sm:p-6 shadow-sm">
          <div className="mb-5">
            <h1 className="text-2xl font-black">저장된 일정</h1>
            <p className="text-sm text-stone-500 mt-1">최근 계산한 준비 일정을 다시 열 수 있어요.</p>
          </div>
          {plans.length === 0 ? (
            <div className="py-16 text-center text-stone-400">아직 저장된 일정이 없어요.</div>

                    <div className="flex items-start justify-between gap-3">
                      <button onClick={() => onOpen(plan)} className="text-left flex-1 min-w-0">
                        <div className="font-black truncate">{plan.title}</div>
                        <div className="text-sm text-stone-500 mt-1">출발 {formatTime(new Date(plan.departureDeadline))} · 도착 {formatTime(new Date(plan.arrivalAt))} · {plan.place}</div>
                        <div className="text-xs text-stone-400 mt-1">{risk.label}</div>
                      </button>
                      <button onClick={() => onDelete(plan.id)} className="p-2 text-stone-400 hover:text-red-600 hover:bg-red-50 rounded-xl"><IconTrash className="w-4 h-4" /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </section>
      );

    function PresetsPage({ actions, setActions, places, setPlaces }) {
      const [mode, setMode] = useState('actions');
      return (
        <div className="space-y-4">
          <section className="bg-white border border-stone-200 rounded-3xl p-4 sm:p-6 shadow-sm">
            <h1 className="text-2xl font-black">내 시간</h1>
            <p className="text-sm text-stone-500 mt-1">자주 하는 행동과 장소 시간을 저장해두면 다음 일정에 자동으로 불러와요.</p>
            <div className="mt-4 grid grid-cols-2 gap-1 bg-stone-100 rounded-2xl p-1 max-w-sm">
              <button onClick={() => setMode('actions')} className={`py-2 rounded-xl text-sm font-bold ${mode === 'actions' ? 'bg-white shadow-sm' : 'text-stone-500'}`}>행동</button>
              <button onClick={() => setMode('places')} className={`py-2 rounded-xl text-sm font-bold ${mode === 'places' ? 'bg-white shadow-sm' : 'text-stone-500'}`}>장소</button>
            </div>
          </section>
          {mode === 'actions' ? <ActionPresets actions={actions} setActions={setActions} /> : <PlacePresets places={places} setPlaces={setPlaces} />}
        </div>
      );
    }

    function ActionPresets({ actions, setActions }) {
      const [draft, setDraft] = useState({ name: '', duration: 10, aliases: '', category: '준비', optional: false });
      const add = () => {
        if (!draft.name.trim()) return;
        setActions(prev => [{ ...draft, id: uid(), duration: Math.max(1, Number(draft.duration || 1)) }, ...prev]);
        setDraft({ name: '', duration: 10, aliases: '', category: '준비', optional: false });
      };
      return (
        <section className="bg-white border border-stone-200 rounded-3xl p-4 sm:p-6 shadow-sm">
          <div className="grid grid-cols-1 sm:grid-cols-5 gap-2 mb-4">
            <input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} className="input sm:col-span-2" placeholder="행동명 예: 씻기" />
            <input type="number" min="1" value={draft.duration} onChange={e => setDraft({ ...draft, duration: e.target.value })} className="input" placeholder="분" />
            <input value={draft.aliases} onChange={e => setDraft({ ...draft, aliases: e.target.value })} className="input sm:col-span-2" placeholder="비슷한 말: 샤워, 머리감기" />
            <label className="sm:col-span-4 flex items-center gap-2 text-sm text-stone-600 px-2"><input type="checkbox" checked={draft.optional} onChange={e => setDraft({ ...draft, optional: e.target.checked })} /> 비상 준비 때 생략 가능</label>
            <button onClick={add} className="py-3 bg-stone-950 text-white rounded-2xl font-bold flex items-center justify-center gap-1"><IconPlus className="w-4 h-4" />추가</button>
          </div>
          <div className="space-y-2">
            {actions.map(action => (
              <ActionRow key={action.id} action={action} onChange={(next) => setActions(prev => prev.map(a => a.id === action.id ? next : a))} onDelete={() => setActions(prev => prev.filter(a => a.id !== action.id))} />
            ))}
          </div>
        </section>
      );
    }

    function ActionRow({ action, onChange, onDelete }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="border border-stone-100 rounded-2xl p-3">
          <div className="flex items-center justify-between gap-3">
            <button onClick={() => setOpen(!open)} className="text-left flex-1 min-w-0">
              <div className="font-black truncate">{action.name} <span className="font-mono-tabular text-emerald-700">{action.duration}분</span></div>
              <div className="text-xs text-stone-500 truncate">{action.aliases || '비슷한 표현 없음'} {action.optional ? '· 비상 시 생략 가능' : ''}</div>
            </button>
            <button onClick={onDelete} className="p-2 text-stone-400 hover:text-red-600 rounded-xl"><IconTrash className="w-4 h-4" /></button>
          </div>
          {open && (
            <div className="grid grid-cols-1 sm:grid-cols-5 gap-2 mt-3">
              <input value={action.name} onChange={e => onChange({ ...action, name: e.target.value })} className="input sm:col-span-2" />
              <input type="number" min="1" value={action.duration} onChange={e => onChange({ ...action, duration: Math.max(1, Number(e.target.value || 1)) })} className="input" />
              <input value={action.aliases} onChange={e => onChange({ ...action, aliases: e.target.value })} className="input sm:col-span-2" />
              <label className="sm:col-span-5 flex items-center gap-2 text-sm text-stone-600 px-2"><input type="checkbox" checked={action.optional} onChange={e => onChange({ ...action, optional: e.target.checked })} /> 비상 준비 때 생략 가능</label>
            </div>
          )}
        </div>
      );
    }

    function PlacePresets({ places, setPlaces }) {
      const [draft, setDraft] = useState({ name: '', moveMin: 30, bufferMin: 15, transport: '차량' });
      const add = () => {
        if (!draft.name.trim()) return;
        setPlaces(prev => [{ ...draft, id: uid(), moveMin: Math.max(0, Number(draft.moveMin || 0)), bufferMin: Math.max(0, Number(draft.bufferMin || 0)) }, ...prev]);
        setDraft({ name: '', moveMin: 30, bufferMin: 15, transport: '차량' });
      };
      return (
        <section className="bg-white border border-stone-200 rounded-3xl p-4 sm:p-6 shadow-sm">
          <div className="grid grid-cols-1 sm:grid-cols-5 gap-2 mb-4">
            <input value={draft.name} onChange={e => setDraft({ ...draft, name: e.target.value })} className="input sm:col-span-2" placeholder="장소명 예: 이룸고" />
            <input type="number" min="0" value={draft.moveMin} onChange={e => setDraft({ ...draft, moveMin: e.target.value })} className="input" placeholder="이동 분" />
            <input type="number" min="0" value={draft.bufferMin} onChange={e => setDraft({ ...draft, bufferMin: e.target.value })} className="input" placeholder="여유 분" />
            <button onClick={add} className="py-3 bg-stone-950 text-white rounded-2xl font-bold flex items-center justify-center gap-1"><IconPlus className="w-4 h-4" />추가</button>
          </div>
          <div className="space-y-2">
            {places.map(place => (
              <PlaceRow key={place.id} place={place} onChange={(next) => setPlaces(prev => prev.map(p => p.id === place.id ? next : p))} onDelete={() => setPlaces(prev => prev.filter(p => p.id !== place.id))} />
            ))}
          </div>
        </section>
      );
    }

    function PlaceRow({ place, onChange, onDelete }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="border border-stone-100 rounded-2xl p-3">
          <div className="flex items-center justify-between gap-3">
            <button onClick={() => setOpen(!open)} className="text-left flex-1 min-w-0">
              <div className="font-black truncate">{place.name}</div>
              <div className="text-xs text-stone-500">이동 {place.moveMin}분 · 여유 {place.bufferMin}분 · {place.transport || '이동수단 미정'}</div>
            </button>
            <button onClick={onDelete} className="p-2 text-stone-400 hover:text-red-600 rounded-xl"><IconTrash className="w-4 h-4" /></button>
          </div>
          {open && (
            <div className="grid grid-cols-1 sm:grid-cols-5 gap-2 mt-3">
              <input value={place.name} onChange={e => onChange({ ...place, name: e.target.value })} className="input sm:col-span-2" />
              <input type="number" min="0" value={place.moveMin} onChange={e => onChange({ ...place, moveMin: Math.max(0, Number(e.target.value || 0)) })} className="input" />
              <input type="number" min="0" value={place.bufferMin} onChange={e => onChange({ ...place, bufferMin: Math.max(0, Number(e.target.value || 0)) })} className="input" />
              <input value={place.transport || ''} onChange={e => onChange({ ...place, transport: e.target.value })} className="input" />
            </div>
          )}
        </div>
      );
    }

    function Toast({ text, onClose }) {
      useEffect(() => {
        const id = setTimeout(onClose, 2200);
        return () => clearTimeout(id);
      }, []);
      return <div className="fixed left-4 right-4 bottom-24 sm:bottom-6 z-50 max-w-md mx-auto bg-stone-950 text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-bold text-center">{text}</div>;
    }

    const style = document.createElement('style');
    style.textContent = `.input{width:100%;border:1px solid rgb(231 229 228);background:rgb(250 250 249);border-radius:1rem;padding:.85rem 1rem;outline:none}.input:focus{border-color:rgb(17 24 39);background:white}`;
    document.head.appendChild(style);

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
